server {
    listen 80;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Central Backend API Proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger Studio 3D Interactive Docs
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # WebSocket Real-Time Event Bus
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Portal 2: Logistics Operations
    location /ops {
        alias /usr/share/nginx/html/ops;
        try_files $uri $uri/ /ops/index.html;
    }

    # Portal 3: Cyber Security Lab
    location /cyber {
        alias /usr/share/nginx/html/cyber;
        try_files $uri $uri/ /cyber/index.html;
    }

    # Portal 1: Clinical Hub (Default Root)
    location / {
        root /usr/share/nginx/html/clinical;
        try_files $uri $uri/ /index.html;
    }
}

